name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./... ./sdk/...
      - run: test -z "$(gofmt -l .)"
      # -race: the ledger and proxy are shared by concurrent requests.
      - run: go test -race -count=1 ./... ./sdk/...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -run '^$' -fuzz=FuzzParse -fuzztime=20s ./internal/parser
      - run: go test -run '^$' -fuzz='FuzzVerify$' -fuzztime=20s ./internal/identity
      - run: go test -run '^$' -fuzz=FuzzVerifySecret -fuzztime=10s ./internal/identity

  # The official MCP Go SDK (client + server) talking through the real
  # gateway binary. Separate module: the SDK needs a newer Go than the gateway.
  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: cd integration/mcp && GOWORK=off go test -count=1 -timeout 120s ./...
